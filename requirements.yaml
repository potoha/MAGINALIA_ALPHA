# Human-readable dependency overview for MAGINALIA_ALPHA.
# package.json files and package-lock.json are the authoritative dependency manifests.

package_manager: npm
lockfile: package-lock.json

workspace_packages:
  - apps/desktop
  - packages/format
  - packages/repository-core
  - packages/source-core
  - packages/writing-core

runtime_dependencies:
  ajv: "8.20.0"
  ajv-formats: "3.0.1"
  isomorphic-git: "1.41.9"
  koffi: "3.3.0"
  monaco-editor: "0.53.0"
  sharp: "^0.34.5"
  ulid: "2.3.0"
  yaml: "2.8.3"

development_dependencies:
  "@types/node": "22.20.2"
  electron: "44.3.0"
  typescript: "7.0.2"
  vite: "8.3.0"
  vitest: "5.0.0"

internal_workspace_dependencies:
  "@maginalia/format": "0.1.0-alpha.0"
  "@maginalia/repository-core": "0.0.0"
  "@maginalia/source-core": "0.0.0"
  "@maginalia/writing-core": "0.0.0"
